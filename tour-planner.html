<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
  <script>
    (() => {
      try {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
      } catch {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tour planner — Keith Dudman beading tours</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root, [data-theme="light"] {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-alt: #f9fafb;
      --border: #e2e4e9;
      --text: #1a1d26;
      --text-secondary: #6b7280;
      --input-bg: #ffffff;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef2ff;
      --accent-glow: rgba(79,70,229,.12);
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #d97706;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
      --shadow-lg: 0 10px 25px rgba(0,0,0,.1);
      --factory: #7c3aed;
      --restaurant: #c2410c;
      --experience: #0f766e;
      --shop: #1d4ed8;
      --museum: #a16207;
      --school: #be185d;
      --hotel: #b45309;
      --travel: #6b7280;
      --pickup: #4f46e5;
    }
    [data-theme="dark"] {
      --bg: #111318;
      --surface: #1a1d24;
      --surface-alt: #21242c;
      --border: #2e3240;
      --text: #e4e6eb;
      --text-secondary: #8b8f9a;
      --input-bg: #21242c;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-soft: rgba(99,102,241,.14);
      --accent-glow: rgba(99,102,241,.22);
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #fbbf24;
      --shadow: 0 1px 3px rgba(0,0,0,.3);
      --shadow-lg: 0 10px 25px rgba(0,0,0,.4);
      --factory: #c4b5fd;
      --restaurant: #fdba74;
      --experience: #5eead4;
      --shop: #93c5fd;
      --museum: #fcd34d;
      --school: #f9a8d4;
      --hotel: #fbbf24;
      --travel: #9ca3af;
      --pickup: #a5b4fc;
    }

    html, body { min-height: 100%; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .wip-banner {
      background: #f59e0b;
      color: #111827;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .02em;
      text-align: center;
      padding: 6px 12px;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      flex-wrap: wrap;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
    .topbar h1 { font-size: 16px; font-weight: 800; letter-spacing: -.3px; }
    .topbar .sub { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
    .view-nav { display: flex; gap: 4px; background: var(--bg); border-radius: 8px; padding: 3px; }
    .view-nav a, .view-nav button {
      padding: 6px 12px; border: none; border-radius: 6px;
      font-family: inherit; font-size: 12px; font-weight: 600;
      cursor: pointer; background: transparent; color: var(--text-secondary);
      text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
    }
    .view-nav a.active, .view-nav button.active {
      background: var(--surface); color: var(--text); box-shadow: var(--shadow);
    }
    .topbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 14px; border: none; border-radius: var(--radius);
      font-family: inherit; font-size: 13px; font-weight: 700;
      cursor: pointer; text-decoration: none; color: inherit;
      min-height: 40px;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: var(--bg); }
    .btn-danger { background: transparent; border: 1px solid var(--border); color: var(--danger); }
    .btn-ghost { background: transparent; color: var(--text-secondary); padding: 6px 8px; min-height: 32px; }
    .btn-lg { min-height: 48px; font-size: 16px; padding: 12px 16px; }
    .btn-sm { min-height: 34px; padding: 6px 10px; font-size: 12px; }

    .wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }

    .status-row {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 700; padding: 4px 10px;
      border-radius: 999px; background: var(--accent-soft); color: var(--accent);
    }
    .pill.warn { background: #fef3c7; color: #92400e; }
    [data-theme="dark"] .pill.warn { background: rgba(245,158,11,.18); color: #fbbf24; }

    .grid-3 {
      display: grid;
      grid-template-columns: 280px 1fr 300px;
      gap: 14px;
      align-items: start;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .card h2 {
      font-size: 13px; font-weight: 800; letter-spacing: .04em;
      text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px;
    }

    label.field-label {
      display: block; font-size: 12px; font-weight: 700;
      color: var(--text-secondary); margin-bottom: 4px;
    }
    input[type="text"], input[type="time"], input[type="date"], select, textarea {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--input-bg); color: var(--text);
      font-family: inherit; font-size: 14px;
    }
    .view-phone input, .view-phone select, .view-phone textarea { font-size: 16px; min-height: 44px; }

    .place-row, .stop-row {
      display: flex; gap: 8px; align-items: center; margin-bottom: 8px;
    }
    .icon-btn {
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-secondary); border-radius: 8px;
      width: 36px; height: 36px; cursor: pointer; flex-shrink: 0;
      font-size: 16px; font-weight: 800;
    }
    .icon-btn:hover { color: var(--danger); border-color: var(--danger); }

    .hotel-card {
      background: var(--accent-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .hotel-card .name { font-weight: 800; font-size: 16px; }
    .hotel-card .meta { color: var(--text-secondary); font-size: 13px; margin: 4px 0 10px; }
    .day-origin {
      background: var(--accent-soft);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .day-origin .name { font-weight: 800; font-size: 15px; margin-top: 2px; }
    .day-origin .meta { color: var(--text-secondary); font-size: 13px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .day-origin.warn { background: transparent; border-style: solid; }
    .day-origin.journey { border-style: solid; border-color: var(--pickup); background: var(--accent-soft); }
    .day-origin .origin-kind { font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); }
    .day-origin .origin-note { margin-top: 6px; font-size: 12px; color: var(--text-secondary); }
    .maps-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent); color: #fff; text-decoration: none;
      font-weight: 800; font-size: 14px; padding: 10px 14px;
      border-radius: 10px; min-height: 44px;
    }
    .maps-btn:hover { background: var(--accent-hover); }

    .day-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
    .day-tab {
      flex: 0 0 auto; border: 1px solid var(--border); background: var(--surface);
      border-radius: 12px; padding: 8px 12px; cursor: pointer; text-align: left;
      font-family: inherit; color: var(--text);
    }
    .day-tab.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .day-tab .d-label { font-weight: 800; font-size: 13px; }
    .day-tab .d-date { font-size: 12px; color: var(--text-secondary); }
    .day-tab.today { background: var(--accent-soft); }

    .timeline { display: flex; flex-direction: column; gap: 0; }
    .stop {
      display: grid;
      grid-template-columns: 108px 18px 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 10px 0;
    }
    .stop-time {
      font-variant-numeric: tabular-nums;
      font-weight: 800; font-size: 15px;
    }
    .stop-time input { padding: 6px 6px; font-weight: 800; font-size: 14px; min-width: 0; }
    .rail { position: relative; height: 100%; min-height: 42px; }
    .rail::before {
      content: ''; position: absolute; left: 7px; top: 8px; bottom: -18px;
      width: 2px; background: var(--border);
    }
    .stop:last-child .rail::before { display: none; }
    .dot {
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--accent); border: 3px solid var(--surface);
      box-shadow: 0 0 0 2px var(--accent); position: relative; z-index: 1;
    }
    .dot.factory { background: var(--factory); box-shadow: 0 0 0 2px var(--factory); }
    .dot.restaurant { background: var(--restaurant); box-shadow: 0 0 0 2px var(--restaurant); }
    .dot.experience { background: var(--experience); box-shadow: 0 0 0 2px var(--experience); }
    .dot.shop { background: var(--shop); box-shadow: 0 0 0 2px var(--shop); }
    .dot.museum { background: var(--museum); box-shadow: 0 0 0 2px var(--museum); }
    .dot.school { background: var(--school); box-shadow: 0 0 0 2px var(--school); }
    .dot.hotel, .dot.meal { background: var(--hotel); box-shadow: 0 0 0 2px var(--hotel); }
    .dot.travel { background: var(--travel); box-shadow: 0 0 0 2px var(--travel); }
    .dot.pickup { background: var(--pickup); box-shadow: 0 0 0 2px var(--pickup); }

    .stop-title { font-weight: 800; font-size: 15px; }
    .stop-title input, .stop-notes input { border: none; background: transparent; padding: 2px 0; }
    .stop-title input:focus, .stop-notes input:focus { outline: none; background: var(--input-bg); border: 1px solid var(--border); }
    .badge {
      display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .04em;
      text-transform: uppercase; padding: 2px 7px; border-radius: 999px;
      background: var(--bg); color: var(--text-secondary); margin-right: 6px;
    }
    .stop-notes { color: var(--text-secondary); font-size: 13px; }
    .stop-actions { display: flex; flex-direction: column; gap: 4px; }

    .travel-note {
      display: flex; gap: 10px; align-items: flex-start;
      margin: 0 0 0 108px; padding: 4px 0 8px 28px;
      color: var(--text-secondary); font-size: 12px; font-weight: 600;
      border-left: 2px dashed var(--border);
    }
    .travel-note .hook {
      display: inline-block; margin-left: 6px; font-weight: 500; font-style: italic;
      opacity: .85;
    }

    .place-list { display: flex; flex-direction: column; gap: 8px; max-height: 70vh; overflow: auto; }
    .place {
      border: 1px solid var(--border); border-radius: 10px; padding: 10px;
      background: var(--surface-alt); cursor: pointer; text-align: left;
      font-family: inherit; color: var(--text); width: 100%;
    }
    .place:hover, .place:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .place .p-name { font-weight: 800; }
    .place .p-meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip {
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }

    .sheet {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 80; display: none; align-items: flex-end; justify-content: center;
    }
    .sheet.open { display: flex; }
    .sheet-panel {
      background: var(--surface); width: min(560px, 100%);
      max-height: 88vh; overflow: auto; border-radius: 18px 18px 0 0;
      padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }

    .toast-wrap { position: fixed; right: 16px; bottom: 16px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      background: var(--text); color: var(--surface); padding: 10px 14px;
      border-radius: 10px; font-size: 13px; font-weight: 700; box-shadow: var(--shadow-lg);
    }

    .view-phone .stop-title { font-size: 20px; }
    .view-phone .stop-time { font-size: 18px; }
    .view-phone .hotel-card .name { font-size: 20px; }
    .view-phone h1 { font-size: 18px; }
    .view-phone .wrap { padding: 12px; }
    .view-phone .grid-3 { grid-template-columns: 1fr; }
    .view-phone .desktop-only { display: none !important; }
    .view-detailed .phone-only { display: none !important; }

    @media (max-width: 980px) {
      .grid-3 { grid-template-columns: 1fr; }
    }

    .muted { color: var(--text-secondary); font-size: 13px; }
    .row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .stack { display: flex; flex-direction: column; gap: 8px; }
    .hidden { display: none !important; }
    select.group-select { min-width: 180px; max-width: 280px; }

    /* Trip summary */
    .trip-summary {
      background: var(--accent-soft);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .trip-summary .trip-title { font-weight: 800; font-size: 18px; margin-bottom: 6px; }
    .trip-summary .trip-meta {
      display: flex; flex-wrap: wrap; gap: 8px 14px;
      font-size: 14px; font-weight: 700;
    }
    .trip-summary .trip-meta span {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 999px; padding: 6px 12px; min-height: 36px;
    }
    .view-phone .trip-summary .trip-title { font-size: 20px; }
    .view-phone .trip-summary .trip-meta span { font-size: 15px; min-height: 40px; }

    /* Guest debt */
    .guest-block {
      border: 1px solid var(--border); border-radius: 12px;
      padding: 10px; margin-bottom: 10px; background: var(--surface-alt);
    }
    .guest-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .guest-row input { flex: 1; }
    .debt-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px;
    }
    @media (max-width: 520px) { .debt-grid { grid-template-columns: 1fr; } }
    .debt-field label {
      display: block; font-size: 11px; font-weight: 800; letter-spacing: .03em;
      text-transform: uppercase; color: var(--text-secondary); margin-bottom: 3px;
    }
    .debt-field input {
      width: 100%; padding: 10px 12px; min-height: 44px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--input-bg); color: var(--text);
      font-family: inherit; font-size: 16px; font-variant-numeric: tabular-nums;
    }
    .debt-balance {
      font-weight: 800; font-size: 15px; padding: 10px 12px; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
      min-height: 44px; display: flex; align-items: center;
    }
    .debt-balance.owes { color: var(--danger); }
    .debt-balance.clear { color: var(--success); }
    .repay-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .repay-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    .repay-row input[type="number"] { width: 96px; min-height: 40px; font-size: 15px; }
    .repay-row input[type="date"] { width: 140px; min-height: 40px; font-size: 14px; }
    .repay-note { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-top: 4px; }

    /* Booking ticks */
    .booking-ticks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .tick {
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid var(--border); background: var(--surface);
      border-radius: 10px; padding: 8px 12px; min-height: 44px;
      font-size: 13px; font-weight: 700; cursor: pointer; user-select: none; color: var(--text);
    }
    .tick input { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
    .tick.on-message { border-color: var(--warning); background: #fffbeb; }
    .tick.on-booked { border-color: var(--success); background: #ecfdf5; }
    [data-theme="dark"] .tick.on-message { background: rgba(245,158,11,.14); }
    [data-theme="dark"] .tick.on-booked { background: rgba(34,197,94,.14); }
    .view-phone .tick { font-size: 15px; min-height: 48px; padding: 10px 14px; }

    .address-row {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    .address-row input[type="text"] { flex: 1 1 160px; min-width: 140px; }
    .maps-btn-inline, .maps-under-field .maps-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px; min-height: 40px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--accent); font-weight: 700; font-size: 13px; text-decoration: none;
    }
    .maps-btn-inline:hover, .maps-under-field .maps-btn:hover { border-color: var(--accent); }
    .maps-under-field { margin-top: 6px; min-height: 8px; }
    .prague-field-actions {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      margin-top: 6px;
    }
    .prague-field-actions .btn { min-height: 40px; }
    .prague-suggest {
      margin-top: 6px; font-size: 12px; color: var(--text-secondary); font-weight: 600;
      line-height: 1.35;
    }
    .prague-suggest strong { color: var(--text); }
    .tick-skip { font-size: 12px; margin-top: 6px; font-weight: 600; }

    .add-to-day-row {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end;
      margin-top: 10px;
    }
    .add-to-day-row .time-field { display: flex; flex-direction: column; gap: 4px; min-width: 120px; }
    .add-to-day-row input[type="time"] {
      min-height: 44px; font-size: 16px; font-weight: 800; padding: 6px 10px;
    }
    .picker-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-top: 8px; }
    .picker-actions .time-field { display: flex; flex-direction: column; gap: 4px; min-width: 120px; }
    .picker-actions input[type="time"] { min-height: 44px; font-size: 16px; font-weight: 800; }

    /* Travel estimate */
    .travel-note {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      margin: 0 0 0 108px; padding: 4px 0 8px 28px;
      color: var(--text-secondary); font-size: 12px; font-weight: 600;
      border-left: 2px dashed var(--border);
    }
    .travel-note input[type="number"] {
      width: 72px; min-height: 36px; padding: 6px 8px; font-size: 14px;
      font-weight: 800; font-variant-numeric: tabular-nums;
    }
    .travel-note .travel-mode-row {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      width: 100%; margin-top: 4px;
    }
    .travel-note .travel-mode-hint {
      width: 100%; font-size: 12px; color: var(--text-secondary); margin-top: 2px;
    }
    .travel-note .chip.travel-mode { font-size: 11px; padding: 4px 9px; }
    .view-phone .travel-note { margin-left: 0; padding-left: 12px; font-size: 14px; }
    .view-phone .travel-note input[type="number"] { min-height: 40px; font-size: 16px; }

    /* Place picker */
    .place-picker {
      border: 1px solid var(--border); border-radius: 12px;
      padding: 10px; background: var(--surface-alt); margin-bottom: 10px;
    }
    .place-picker select { width: 100%; min-height: 48px; font-size: 16px; margin-bottom: 8px; }
    .place-picker .picker-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Places directory */
    .place-dir-item {
      border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; margin-bottom: 10px; background: var(--surface-alt);
    }
    .place-dir-item .dir-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;
    }
    @media (max-width: 640px) { .place-dir-item .dir-grid { grid-template-columns: 1fr; } }
    .contact-pill {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .03em; padding: 3px 8px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent); margin-left: 6px;
    }

    /* ── Auto-save toggle (matches booking form) ── */
    .autosave-toggle {
      display: flex; align-items: center; gap: 8px;

  const PRAGUE_CLEAR_MIN = 85;

  function roughTravelMinutes(fromAddr, toAddr) {

    if (!a || !b) {

      if (/prague|praha|airport|aviatická/i.test(a) || /prague|praha|airport|aviatická/i.test(b)) {
        return PRAGUE_CLEAR_MIN;
      }
      return 20;
    }
    if (a.toLowerCase() === b.toLowerCase()) return 5;
    const sameTown = /jablonec|liberec|turnov|zásada|zasada|prague|praha/i;
    const aTown = (a.match(sameTown) || [''])[0].toLowerCase();
    const bTown = (b.match(sameTown) || [''])[0].toLowerCase();
    if (aTown && bTown && aTown === bTown) return 15;
    if (/prague|praha/i.test(a) || /prague|praha/i.test(b)) return PRAGUE_CLEAR_MIN;

  }

  function looksLikeBeadingAreaText(text) {

  function placeNameKey(name) {
    return String(name || '').trim().toLowerCase();
  }

  function namesRoughlyMatch(a, b) {
    const norm = (s) => String(s || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
    const na = norm(a);
    const nb = norm(b);
    if (!na || !nb) return false;
    return na === nb || na.includes(nb) || nb.includes(na);
  }

  function hotelPlaces() {
    return (state.catalogue || [])
      .filter(p => (p.type || '') === 'hotel')
      .slice()
      .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base' }));
  }

  function getTourHotelPlace() {
    if (!state.plan) return null;
    const id = state.plan.tourHotelPlaceId;
    if (id) {
      const byId = (state.catalogue || []).find(p => p.id === id);
      if (byId) return byId;
    }
    const name = state.plan.tourHotelName || '';
    if (!name) return null;
    const hotels = hotelPlaces();
    return hotels.find(p => placeNameKey(p.name) === placeNameKey(name))
      || hotels.find(p => namesRoughlyMatch(p.name, name))
      || null;
  }

  function matchHotelPlaceFromText(text) {
    const raw = String(text || '').trim();
    if (!raw) return null;
    const hotels = hotelPlaces();
    return hotels.find(p => placeNameKey(p.name) === placeNameKey(raw))
      || hotels.find(p => namesRoughlyMatch(p.name, raw))
      || null;
  }

  function formatNominatimStreet(hit) {
    if (!hit) return '';
    const a = hit.address || {};
    const road = a.road || a.pedestrian || a.footway || a.square || a.neighbourhood || '';
    const num = a.house_number || '';
    const city = a.city || a.town || a.municipality || a.village || 'Prague';
    const postcode = a.postcode || '';
    let street = '';
    if (road && num) street = road + ' ' + num;
    else if (road) street = road;
    else if (hit.display_name) {
      // Fall back carefully — take the part after the name if present
      const parts = String(hit.display_name).split(',').map(s => s.trim()).filter(Boolean);
      if (parts.length >= 2) street = parts.slice(1, 3).join(', ');
    }
    if (!street) return '';
    const bits = [street];
    if (postcode) bits.push(postcode);
    if (city) bits.push(city);
    return bits.join(', ');
  }

  function nominatimHitLooksLikeHotel(hit, hotelName) {
    if (!hit) return false;
    const name = String(hotelName || '').trim();
    const hitName = hit.name || (hit.address && (hit.address.tourism || hit.address.hotel)) || '';
    const display = hit.display_name || '';
    const classOk = hit.class === 'tourism' || hit.type === 'hotel' || hit.addresstype === 'tourism'
      || /hotel/i.test(String(hit.type || '')) || /hotel/i.test(String(hitName));
    const nameOk = !name || namesRoughlyMatch(hitName, name) || namesRoughlyMatch(display, name);
    const inPrague = /praha|prague|\bcz\b/i.test(display)
      || /praha|prague/i.test(String((hit.address && (hit.address.city || hit.address.town)) || ''));
    return classOk && nameOk && inPrague;
  }

  async function lookupPragueHotelAddress() {
    const h = state.plan?.pragueHotel || {};
    const name = String(h.name || '').trim();
    const hint = document.getElementById('pragueAddressHint');
    const setHint = (msg, isError) => {
      if (!hint) return;
      hint.innerHTML = msg || '';
      hint.style.color = isError ? 'var(--danger)' : '';
    };
    if (!name) {
      setHint('Type a Prague hotel name first, then try Find address.', true);
      toast('Enter the Prague hotel name first');
      return;
    }
    const btn = document.getElementById('btnFindPragueAddress');
    if (btn) { btn.disabled = true; btn.textContent = 'Looking up…'; }
    setHint('Searching OpenStreetMap (Nominatim) for a suggested street — please double-check.');
    const q = name + ' Prague';
    const url = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&q='
      + encodeURIComponent(q);
    try {
      const res = await fetch(url, {
        headers: {
          'Accept': 'application/json',
          // Nominatim asks for a valid identifying User-Agent / Referer; browsers set Referer.
        },
      });
      if (!res.ok) throw new Error('Lookup failed (' + res.status + ')');
      const rows = await res.json();
      const hits = Array.isArray(rows) ? rows : [];
      const confident = hits.find(hit => nominatimHitLooksLikeHotel(hit, name));
      const street = formatNominatimStreet(confident);
      if (confident && street) {
        state.plan.pragueHotel.address = street;
        const inp = document.getElementById('pragueAddress');
        if (inp) inp.value = street;
        syncDay1PraguePickupStop();
        updatePragueHotelMapsUi();
        scheduleAutoSave();
        setHint('Suggested street from OpenStreetMap — please confirm it matches the real hotel before relying on it: <strong>'
          + escapeHtml(street) + '</strong>');
        toast('Suggested address filled — please double-check');
        return;
      }
      // Not confident enough to invent a street — open Apple Maps instead
      setHint('No confident street found in OpenStreetMap. Opening Apple Maps so you can copy the real address back.');
      toast('No confident address — opening Apple Maps');
      window.open(pragueHotelAppleMapsUrl(name, ''), '_blank', 'noopener');
    } catch (err) {
      setHint('Address lookup unavailable right now. Use Open in Apple Maps and copy the street back.', true);
      toast('Lookup failed — use Apple Maps instead');
      window.open(pragueHotelAppleMapsUrl(name, state.plan.pragueHotel.address || ''), '_blank', 'noopener');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = 'Find address'; }
    }
  }

  function planRichnessScore(plan) {
    if (!plan || typeof plan !== 'object') return 0;
    let score = 0;
    const days = Array.isArray(plan.days) ? plan.days : [];
    score += days.length * 10;
    const genericTitle = /^(breakfast|leave for tours|leave hotel( at \d{2}:\d{2})?|hotel pick-up|pick-up from prague hotel\s*\/?\s*airport)$/i;
    const genericNotes = /hotel unless noted|van ready at the hotel|confirm the meeting point the night before/i;
    days.forEach(d => {
      (d.blocks || []).forEach(b => {
        if (!b) return;
        score += 5;
        const title = String(b.title || '').trim();
        if (title && !genericTitle.test(title)) score += 25;
        const addr = String(b.address || '').trim();
        if (addr && addr.toLowerCase() !== 'axa' && addr.length > 2) score += 8;
        const notes = String(b.notes || '').trim();
        if (notes && !genericNotes.test(notes)) score += 10;
        if (b.placeId || b.place_id) score += 4;
        if (b.booked) score += 2;
        if (b.messageSent) score += 1;
      });
    });
    if (plan.pragueHotel && String(plan.pragueHotel.name || '').trim()) score += 20;
    if (plan.pragueHotel && String(plan.pragueHotel.address || '').trim()) score += 10;
    if (plan.tourHotelName && String(plan.tourHotelName).trim()) score += 3;
    try { score += Math.min(80, Math.floor(JSON.stringify(plan).length / 80)); } catch (_) {}
    return score;
  }

  function preferRicherPlan(localPlan, cloudPlan) {
    if (!cloudPlan) return localPlan || null;
    if (!localPlan) return cloudPlan;
    const localScore = planRichnessScore(localPlan);
    const cloudScore = planRichnessScore(cloudPlan);
    if (localScore > cloudScore) {
      console.info('Keeping richer local plan (score', localScore, '> cloud', cloudScore, ')');
      return localPlan;
    }
    if (cloudScore > localScore) {
      console.info('Using richer cloud plan (score', cloudScore, '> local', localScore, ')');
      return cloudPlan;
    }
    // Tie: keep local so we never wipe Keith's in-progress edits with a same-thin skeleton
    return localPlan;
  }

  function countPlanBlocks(plan) {
    if (!plan || !Array.isArray(plan.days)) return 0;
    return plan.days.reduce((n, d) => n + ((d && d.blocks) ? d.blocks.length : 0), 0);
  }

  function loadStore() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {};
    } catch { return {}; }
  }
  function persist() {
    const store = loadStore();
    // Never wipe cloud/local catalogue with an empty in-memory list
    if (Array.isArray(state.catalogue) && state.catalogue.length) {
      store.catalogue = state.catalogue;
    }
    store.plans = store.plans || {};
    if (state.plan) store.plans[state.plan.bookingKey] = state.plan;
    store.plans = Object.assign(store.plans, state.plans);
    if (state.plan) store.plans[state.plan.bookingKey] = state.plan;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    state.plans = store.plans;
    // Always attempt cloud upsert of the current plan (autosave toggle only controls timing of edits)
    // Pass { force: true } from Force save to cloud to allow overwriting a richer cloud row
    const force = !!(arguments[0] && arguments[0].force);
    state._lastCloudRefuse = null;
    state._cloudSavePromise = maybeSaveSupabase({ force });
    return state._cloudSavePromise;
  }

  let saveTimer = null;
  function schedulePersist() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 250);
  }

  let autoSaveEnabled = false;
  const AUTOSAVE_DELAY = 2000;
  let autoSaveTimer = null;

  function toggleAutoSave(enabled) {
    autoSaveEnabled = !!enabled;
    const status = document.getElementById('autosaveStatus');
    if (!status) return;
    if (autoSaveEnabled) {
      status.textContent = 'On';
      status.className = 'autosave-status saved';
    } else {
      status.textContent = '';
      status.className = 'autosave-status';
      clearTimeout(autoSaveTimer);
    }
    localStorage.setItem('planner_autosave_enabled', autoSaveEnabled ? 'true' : 'false');
  }

  function scheduleAutoSave() {
    if (!autoSaveEnabled) {
      schedulePersist();
      return;
    }
    clearTimeout(saveTimer);
    clearTimeout(autoSaveTimer);
    const status = document.getElementById('autosaveStatus');
    if (status) {
      status.textContent = 'Unsaved';
      status.className = 'autosave-status saving';
    }
    autoSaveTimer = setTimeout(async () => {
      if (status) {
        status.textContent = 'Saving…';
        status.className = 'autosave-status saving';
      }
      const ok = await persist();
      if (status) {
        if (ok) {
          status.textContent = 'Cloud saved';
          status.className = 'autosave-status saved';
        } else {
          status.textContent = 'Cloud save failed';
          status.className = 'autosave-status failed';
        }
        setTimeout(() => {
          const el = document.getElementById('autosaveStatus');
          if (!el) return;
          if (el.textContent === 'Cloud saved' || el.textContent === 'Cloud save failed') {
            el.textContent = autoSaveEnabled ? 'On' : '';
            el.className = 'autosave-status' + (autoSaveEnabled ? ' saved' : '');
          }
        }, 2800);
      }
    }, AUTOSAVE_DELAY);
  }

  function setCloudStatus(ok, detail) {
    state.cloudSaveOk = !!ok;
    const status = document.getElementById('autosaveStatus');
    if (!status) return;
    if (ok) {
      status.textContent = detail || 'Cloud saved';
      status.className = 'autosave-status saved';
    } else if (detail) {
      status.textContent = detail;
      status.className = 'autosave-status failed';

  }

  async function forceSaveToCloud() {
    const status = document.getElementById('autosaveStatus');
    if (status) {
      status.textContent = 'Saving…';
      status.className = 'autosave-status saving';
    }
    // Force flag allows overwriting a richer cloud plan deliberately
    const ok = await persist({ force: true });
    if (ok) {
      setCloudStatus(true, 'Cloud saved');
      toast('Plan uploaded to cloud');
    } else {
      setCloudStatus(false, 'Cloud save failed');

  function mergeCatalogueLists(primary, secondary) {
    const byId = new Map();
    const byName = new Map();
    function add(list, preferExisting) {
      (list || []).forEach(raw => {
        const p = ensurePlace({ ...raw });
        if (!p.id) p.id = uid('p');
        const nk = placeNameKey(p.name);
        if (byId.has(p.id)) {
          if (!preferExisting) byId.set(p.id, { ...byId.get(p.id), ...p, id: p.id });
          return;
        }
        if (nk && byName.has(nk)) {
          if (!preferExisting) {
            const prev = byName.get(nk);
            const merged = { ...prev, ...p, id: prev.id };
            byId.set(prev.id, merged);
            byName.set(nk, merged);
          }
          return;
        }
        byId.set(p.id, p);
        if (nk) byName.set(nk, p);
      });
    }
    // secondary first, then primary wins on conflict
    add(secondary, false);
    add(primary, false);
    return normalizeCatalogue([...byId.values()]);
  }

  async function fetchCloudPlaces() {
    if (!state.supabasePlacesTable) return null;
    try {
      const { data, error } = await withTimeout(
        sb.from('planner_places').select('*').order('sort_order', { ascending: true }),
        5000,
        'Places lookup timed out'
      );

  async function uploadCatalogueSeed() {

  async function savePlacesToSupabase() {
    if (!state.supabasePlacesTable) return false;
    if (!Array.isArray(state.catalogue) || !state.catalogue.length) return false;
    try {
      const rows = state.catalogue.map((p, i) => placeToRow(p, i));
      const { error } = await sb.from('planner_places').upsert(rows, { onConflict: 'client_id' });

  async function loadPlanFromSupabase(key) {
    if (!state.supabasePlanTable || !key) return null;
    try {
      let q;
      if (key === DEMO_ID || !/^[0-9]+$/.test(String(key))) {
        q = sb.from('planner_plans').select('*').eq('client_key', String(key)).maybeSingle();
      } else {
        q = sb.from('planner_plans').select('*').eq('booking_id', Number(key)).maybeSingle();
      }
      const { data, error } = await withTimeout(q, 4000, 'Plan lookup timed out');
      if (error) throw error;
      if (!data || !data.payload) return null;
      const plan = normalizePlan({ ...data.payload, bookingKey: String(key) });
      return plan;
    } catch (err) {
      console.warn('Cloud plan not loaded:', err);
      return null;
    }
  }

  async function maybeSaveSupabase(opts) {
    const force = !!(opts && opts.force);
    let placesOk = false;
    let planOk = false;
    try {
      placesOk = await savePlacesToSupabase();
    } catch (err) {
      console.warn(err);
    }
    if (state.supabasePlanTable && state.plan) {
      try {
        const key = String(state.plan.bookingKey || DEMO_ID);
        const isBooking = /^[0-9]+$/.test(key);
        // Anti-clobber: never overwrite a richer cloud plan with a thinner local one unless Force save
        if (!force) {
          const existingCloud = await loadPlanFromSupabase(key);
          if (existingCloud) {
            const cloudBlocks = countPlanBlocks(existingCloud);
            const localBlocks = countPlanBlocks(state.plan);
            const cloudScore = planRichnessScore(existingCloud);
            const localScore = planRichnessScore(state.plan);
            if (cloudBlocks > localBlocks || cloudScore > localScore) {
              console.warn('Refusing cloud overwrite: cloud has more detail (blocks', cloudBlocks, 'vs', localBlocks, ', score', cloudScore, 'vs', localScore, '). Use Force save to cloud to override.');
              setCloudStatus(false, 'Kept richer cloud');
              state.cloudSaveOk = false;
              state._lastCloudRefuse = { cloudBlocks, localBlocks, cloudScore, localScore };
              return false;
            }
          }
        }
        const row = {
          payload: state.plan,
          updated_at: new Date().toISOString(),
          booking_id: isBooking ? Number(key) : null,
          client_key: isBooking ? ('booking:' + key) : key,
        };
        // Prefer unique booking_id when set; otherwise unique client_key (demo)
        const onConflict = isBooking ? 'booking_id' : 'client_key';
        const { error } = await sb.from('planner_plans').upsert(row, { onConflict });
        if (error) throw error;
        planOk = true;
      } catch (err) {
        console.warn('Could not save plan to Supabase:', err);
      }
    }
    // Plan upsert is what matters for Keith's schedules; places-only success is not "Cloud saved"
    if (state.supabasePlanTable && state.plan) {
      if (planOk) setCloudStatus(true, 'Cloud saved');
      else if (!(state._lastCloudRefuse && !force)) setCloudStatus(false, 'Cloud save failed');
      return planOk;
    }
    const ok = placesOk || planOk;
    setCloudStatus(ok, ok ? 'Cloud saved' : (state.supabasePlanTable ? 'Cloud save failed' : 'No cloud table'));
    return ok;
  }

  function pragueFromBooking(b) {
    const stays = b._hotel_stays || [];
    const pragueStay = stays.find(s => {
      const n = (s.hotels?.name || s.custom_hotel_name || '').toLowerCase();
      return /prague|praha/.test(n);
    });
    const name = pragueStay?.hotels?.name || pragueStay?.custom_hotel_name || '';
    return { name, address: '', pickupTime: '08:00' };
  }

  function formatFlightTime(t) {
    if (!t) return '';
    const s = String(t);
    // Supabase TIME may arrive as HH:MM:SS
    return s.length >= 5 ? s.slice(0, 5) : s;
  }

  function airportFromBooking(b) {
    const flights = b._flights || [];
    const withArr = flights.filter(f => f && f.arrival_time);
    const lines = withArr.map(f => {
      const bits = [];
      if (f.flight_number) bits.push(f.flight_number);
      if (f.arrival_date) bits.push(formatDateDMY(f.arrival_date));
      bits.push(formatFlightTime(f.arrival_time));
      return bits.join(' · ');
    });
    return {
      hasTimes: withArr.length > 0,
      times: withArr.map(f => formatFlightTime(f.arrival_time)).filter(Boolean),
      summary: lines.join(' · '),
      pickupTime: withArr.length ? formatFlightTime(withArr[0].arrival_time) : '',
    };
  }

  function planFromBooking(b) {
    const key = String(b.id);
    const existing = state.plans[key];
    const guests = guestNamesFromMembers(b._members);
    const prague = pragueFromBooking(b);
    const airport = airportFromBooking(b);
    const bookingHotelText = b.hotel_name || b.hotels?.name || '';
    const matchedHotel = matchHotelPlaceFromText(bookingHotelText);
    const base = emptyPlan({
      bookingKey: key,
      groupName: b.group_name || ('Booking #' + b.id),
      guests: guests.length ? guests : [{ id: uid('g'), name: '' }],
      arrivalDate: b.tour_arrival_date || '',
      departureDate: b.departure_date || '',
      tourHotelPlaceId: matchedHotel ? matchedHotel.id : '',
      tourHotelName: matchedHotel ? matchedHotel.name : bookingHotelText,
      pragueHotel: prague,
      airportArrival: airport,
      day1OriginType: airport.hasTimes ? 'airport' : 'prague',
      source: 'booking',
    });
    if (!existing) return base;
    existing.groupName = existing.groupName || base.groupName;
    const named = (existing.guests || []).some(g => (g.name || '').trim());
    if (!existing.guests?.length || !named) existing.guests = base.guests;
    else existing.guests = existing.guests.map(g => ensureGuestDebt(g));
    if (!existing.pragueHotel?.name && base.pragueHotel.name) existing.pragueHotel = base.pragueHotel;
    // Keep airport arrival times in sync from the booking when present
    if (base.airportArrival?.hasTimes) {
      existing.airportArrival = base.airportArrival;
      if (!existing.day1OriginType) existing.day1OriginType = 'airport';
    } else if (!existing.airportArrival) {
      existing.airportArrival = base.airportArrival;
    }
    if (!existing.day1OriginType) {
      existing.day1OriginType = base.day1OriginType;
    }
    if (existing.day1OriginType === 'airport' && !hasAirportArrivalOption(existing)) {
      existing.day1OriginType = 'prague';
    }
    if (!existing.tourHotelPlaceId && base.tourHotelPlaceId) {
      existing.tourHotelPlaceId = base.tourHotelPlaceId;
      existing.tourHotelName = base.tourHotelName;
    } else if (!existing.tourHotelName) {
      existing.tourHotelName = base.tourHotelName;
      if (base.tourHotelPlaceId) existing.tourHotelPlaceId = base.tourHotelPlaceId;
    }
    if (!existing.arrivalDate && base.arrivalDate) existing.arrivalDate = base.arrivalDate;
    if (!existing.departureDate && base.departureDate) existing.departureDate = base.departureDate;
    if (base.arrivalDate && (existing.arrivalDate !== base.arrivalDate || existing.departureDate !== base.departureDate)) {
      existing.arrivalDate = base.arrivalDate;
      existing.departureDate = base.departureDate;
      mergeDays(existing, base.days);
    }
    return normalizePlan(existing);
  }

  function mergeDays(existing, freshDays) {
    const byDate = {};
    (existing.days || []).forEach(d => { if (d.date) byDate[d.date] = d; });
    existing.days = freshDays.map((d, i) => byDate[d.date] || existing.days[i] || d);
  }

  function withTimeout(promise, ms, label) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error(label || 'Timed out')), ms)),
    ]);
  }

  async function enrichBooking(b) {
    if (!b || b._enriched) return b;
    try {
      const [members, stays, flights] = await withTimeout(Promise.all([
        sb.from('members').select('*').eq('booking_id', b.id).order('id'),
        sb.from('booking_hotels').select('*, hotels(name)').eq('booking_id', b.id),
        sb.from('flights').select('*').eq('booking_id', b.id).order('id'),
      ]), 4000, 'Booking details timed out');
      b._members = members.data || [];
      b._hotel_stays = stays.data || [];
      b._flights = flights.data || [];
    } catch (err) {
      console.warn('Could not load members/hotels/flights for booking', b.id, err);
      b._flights = b._flights || [];
    }
    b._enriched = true;
    return b;
  }

  async function selectPlan(key) {
    state.bookingKey = key;
    const localPlan = state.plans[key] || null;
    const cloudPlan = await loadPlanFromSupabase(key);
    const chosen = preferRicherPlan(localPlan, cloudPlan);
    if (chosen) {
      state.plans[key] = chosen;
      if (localPlan && cloudPlan && chosen === localPlan && planRichnessScore(localPlan) > planRichnessScore(cloudPlan)) {
        toast('Kept richer plan from this device (cloud had a thinner skeleton)');
      }
    }
    if (key === DEMO_ID) {
      state.plan = state.plans[DEMO_ID] || buildDemoPlan();
    } else {
      const b = state.bookings.find(x => String(x.id) === String(key));
      if (b) {
        await enrichBooking(b);
        // planFromBooking merges local/cloud existing with booking metadata
        state.plan = planFromBooking(b);
      } else {
        state.plan = state.plans[key] || buildDemoPlan();
      }
    }
    normalizePlan(state.plan);
    state.plans[state.plan.bookingKey] = state.plan;
    const today = todayISO();
    const idx = state.plan.days.findIndex(d => d.date === today);
    state.selectedDay = idx >= 0 ? idx : 0;
    const url = new URL(location.href);
    if (key === DEMO_ID) url.searchParams.delete('booking');
    else url.searchParams.set('booking', key);
    history.replaceState({}, '', url);
    persist();
    render();
    fillGroupSelect();
    fixExternalNavLinks();
  }

    });
    sortDayBlocks(day);

  function moveStop(id, dir) {
    const day = currentDay();
    if (!day) return;
    const i = day.blocks.findIndex(s => s.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= day.blocks.length) return;
    const tmp = day.blocks[i];
    day.blocks[i] = day.blocks[j];
    day.blocks[j] = tmp;
    // “From …” text follows the new order on render; re-seed only blank estimates.
    [i, j].forEach(idx => {
      if (day.blocks[idx] && day.blocks[idx].travelMinutes == null) seedTravelMinutes(day, idx);
    });
    scheduleAutoSave();
    render();
  }
  function addManualDay() {

      if (d) nextDate = toISODateUTC(new Date(d.getTime() + 86400000));

    state.plan.days.push({

  function rebuildFromDates() {
    const dates = enumerateDates(state.plan.arrivalDate, state.plan.departureDate);
    if (!dates.length) { toast('Enter arrival and departure dates first'); return; }
    const ctx = {
      tourHotelName: state.plan.tourHotelName,
      pragueHotelName: state.plan.pragueHotel?.name,
      pragueAddress: state.plan.pragueHotel?.address,
      pickupTime: day1PickupTime(state.plan),
      day1OriginType: effectiveDay1OriginType(state.plan),
      hasAirport: hasAirportArrivalOption(state.plan),
    };
    const byDate = {};
    state.plan.days.forEach(d => { if (d.date) byDate[d.date] = d; });
    state.plan.days = dates.map((date, i) => byDate[date] || { id: uid('d'), date, blocks: defaultBlocks(i, ctx) });
    state.selectedDay = Math.min(state.selectedDay, state.plan.days.length - 1);
    scheduleAutoSave();
    render();
  }

            </div>` : `<p class="muted tick-skip">No message / booked ticks for ${escapeHtml(typeLabel(s.type).toLowerCase())}.</p>`}
          </div>

            <button type="button" class="icon-btn" data-move="${s.id}" data-dir="-1" aria-label="Move up">↑</button>

            <button type="button" class="icon-btn" data-remove-stop="${s.id}" aria-label="Remove stop">×</button>
          </div>
        </article>
      `;
      if (shouldShowTravel(s, next) || true) {
        // Travel into this stop: previous place, day-1 Prague/airport origin, or tour hotel (day 2+)
        const mins = s.travelMinutes == null ? '' : String(s.travelMinutes);
        const label = travelFromLabel(day, i);
        const longLeg = isPragueBeadingTravel(day, i, s);
        let modeChips = '';
        if (longLeg) {
          const mode = (s.travelMode === 'clear' || s.travelMode === 'traffic')
            ? s.travelMode
            : (s.travelMinutes === PRAGUE_TRAFFIC_MIN ? 'traffic'
              : (s.travelMinutes === PRAGUE_CLEAR_MIN ? 'clear' : suggestedTravelMode(day, s)));
          modeChips = `
            <div class="travel-mode-row" role="group" aria-label="Prague drive estimate">
              <button type="button" class="chip travel-mode ${mode === 'clear' ? 'on' : ''}" data-travel-mode="${s.id}" data-mode="clear">Clear road · ${PRAGUE_CLEAR_MIN} min</button>
              <button type="button" class="chip travel-mode ${mode === 'traffic' ? 'on' : ''}" data-travel-mode="${s.id}" data-mode="traffic">Work morning · ${PRAGUE_TRAFFIC_MIN} min</button>
            </div>
            <div class="travel-mode-hint">About ${PRAGUE_CLEAR_MIN} min clear / about ${PRAGUE_TRAFFIC_MIN} min in weekday morning traffic. Pick one to set the editable minutes.</div>`;
        }
        html += `<div class="travel-note">🚐 ${escapeHtml(label)}:
          <label class="muted">≈ <input type="number" inputmode="numeric" min="0" step="5" data-travel-mins="${s.id}" value="${escapeHtml(mins)}" aria-label="Travel minutes"> min (±5)</label>
          <span class="muted">editable estimate</span>
          ${modeChips}
        </div>`;
      }
      if (shouldShowTravel(s, next)) {
        const hook = (s.address && next.address)
          ? `<span class="hook" title="Exact travel time later — Maps API not wired in this prototype.">Exact travel time later — Maps API not wired in this prototype.</span>`
          : `<span class="hook">Exact travel time later — Maps API not wired in this prototype.</span>`;
        html += `<div class="travel-note" style="opacity:.85;">${hook}</div>`;
      }
    });
    html += '</div>';
    return html;
  }

  function captureUiState() {
    const active = document.activeElement;
    let focus = null;
    if (active && active.closest && active.closest('#app')) {
      const focusAttrs = [
        'data-place-name', 'data-place-address', 'data-place-contact-detail', 'data-place-notes',
        'data-place-type', 'data-place-contact-method', 'data-add-place-time',
        'data-stop-title', 'data-stop-notes', 'data-stop-address', 'data-stop-time', 'data-stop-travel',
        'data-guest-name', 'data-guest-lent', 'data-repay-amount', 'data-repay-date'
      ];
      for (const attr of focusAttrs) {
        if (active.hasAttribute && active.hasAttribute(attr)) {
          focus = {
            attr,
            value: active.getAttribute(attr),
            repayId: active.getAttribute('data-repay-id') || null,
            tag: active.tagName,
            type: active.type || '',
            selStart: typeof active.selectionStart === 'number' ? active.selectionStart : null,
            selEnd: typeof active.selectionEnd === 'number' ? active.selectionEnd : null,
          };
          break;
        }
      }
      if (!focus && active.id) {
        focus = {
          id: active.id,
          tag: active.tagName,
          type: active.type || '',
          selStart: typeof active.selectionStart === 'number' ? active.selectionStart : null,
          selEnd: typeof active.selectionEnd === 'number' ? active.selectionEnd : null,
        };
      }
    }
    const placeList = document.querySelector('.place-list');
    return {
      windowY: window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0,
      placeListTop: placeList ? placeList.scrollTop : null,
      focus,
    };
  }

  function restoreUiState(snap) {
    if (!snap) return;
    const apply = () => {
      if (snap.placeListTop != null) {
        const placeList = document.querySelector('.place-list');
        if (placeList) placeList.scrollTop = snap.placeListTop;
      }
      try { window.scrollTo(0, snap.windowY || 0); } catch { /* ignore */ }
      const f = snap.focus;
      if (!f) return;
      let el = null;
      if (f.id) {
        el = document.getElementById(f.id);
      } else if (f.attr) {
        const nodes = Array.from(document.querySelectorAll(`[${f.attr}="${CSS.escape(String(f.value))}"]`));
        el = nodes.find(n => !f.repayId || n.getAttribute('data-repay-id') === f.repayId) || nodes[0] || null;
      }
      if (!el || typeof el.focus !== 'function') return;
      try { el.focus({ preventScroll: true }); } catch { try { el.focus(); } catch { /* ignore */ } }
      try {
        if (f.selStart != null && typeof el.setSelectionRange === 'function' && /^(text|search|url|tel|password|email|number)$/i.test(el.type || 'text')) {
          el.setSelectionRange(f.selStart, f.selEnd != null ? f.selEnd : f.selStart);
        }
      } catch { /* ignore */ }
    };
    requestAnimationFrame(() => requestAnimationFrame(apply));
  }

  function parseEnteredDate(value) {
    const s = String(value || '').trim();
    if (!s) return '';
    let m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (m) return s;
    m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/.exec(s);
    if (!m) return '';
    const d = Number(m[1]), mo = Number(m[2]), y = Number(m[3]);
    const dt = new Date(Date.UTC(y, mo - 1, d));
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return '';
    return toISODateUTC(dt);
  }

    q('#arrivalDate')?.addEventListener('change', e => {
      state.plan.arrivalDate = parseEnteredDate(e.target.value);
      e.target.value = state.plan.arrivalDate ? formatDateDMY(state.plan.arrivalDate) : e.target.value;
      scheduleAutoSave();

    q('#departureDate')?.addEventListener('change', e => {
      state.plan.departureDate = parseEnteredDate(e.target.value);
      e.target.value = state.plan.departureDate ? formatDateDMY(state.plan.departureDate) : e.target.value;

    q('#day1OriginType')?.addEventListener('change', e => {
      const v = e.target.value === 'airport' && hasAirportArrivalOption() ? 'airport' : 'prague';
      state.plan.day1OriginType = v;
      if (v === 'prague') syncDay1PraguePickupStop();
      scheduleAutoSave();

    q('#pragueName')?.addEventListener('input', e => {
      state.plan.pragueHotel.name = e.target.value;
      onPragueHotelFieldChange();
    });
    q('#pragueName')?.addEventListener('change', () => onPragueHotelFieldChange({ render: true }));
    q('#pragueAddress')?.addEventListener('input', e => {
      state.plan.pragueHotel.address = e.target.value;
      onPragueHotelFieldChange();
    });
    q('#pragueAddress')?.addEventListener('change', () => onPragueHotelFieldChange({ render: true }));
    q('#pragueTime')?.addEventListener('input', e => {
      state.plan.pragueHotel.pickupTime = e.target.value;
      onPragueHotelFieldChange();
    });
    q('#pragueTime')?.addEventListener('change', () => onPragueHotelFieldChange({ render: true }));
    q('#btnFindPragueAddress')?.addEventListener('click', () => { lookupPragueHotelAddress(); });
    q('#btnAddGuest')?.addEventListener('click', addGuest);
    q('#btnAddDay')?.addEventListener('click', addManualDay);
    q('#btnRebuildDays')?.addEventListener('click', rebuildFromDates);
    q('#btnAddStop')?.addEventListener('click', addBlankStop);
    q('#btnOpenSheet')?.addEventListener('click', openSheet);
    q('#btnGotoPlaces')?.addEventListener('click', () => setMainTab('places'));
    q('#btnBackPlanner')?.addEventListener('click', () => setMainTab('planner'));
    document.querySelectorAll('[data-main-tab]').forEach(btn => {
      btn.addEventListener('click', () => setMainTab(btn.getAttribute('data-main-tab')));
    });
    q('#btnResetDemo')?.addEventListener('click', () => {
      state.plans[DEMO_ID] = buildDemoPlan();
      state.catalogue = defaultCatalogue();
      selectPlan(DEMO_ID);
      toast('Sample tour restored');
    });

    document.querySelectorAll('[data-guest-name]').forEach(inp => {
      inp.addEventListener('input', () => {
        const g = state.plan.guests.find(x => x.id === inp.getAttribute('data-guest-name'));
        if (g) { g.name = inp.value; scheduleAutoSave(); }
      });
    });
    document.querySelectorAll('[data-remove-guest]').forEach(btn => {
      btn.addEventListener('click', () => removeGuest(btn.getAttribute('data-remove-guest')));
    });
    document.querySelectorAll('[data-guest-lent]').forEach(inp => {
      inp.addEventListener('input', () => setGuestLent(inp.getAttribute('data-guest-lent'), inp.value));
      inp.addEventListener('change', () => setGuestLent(inp.getAttribute('data-guest-lent'), inp.value));
    });
    document.querySelectorAll('[data-add-repay]').forEach(btn => {
      btn.addEventListener('click', () => addGuestRepayment(btn.getAttribute('data-add-repay')));
    });
    document.querySelectorAll('[data-repay-amount]').forEach(inp => {
      inp.addEventListener('input', () => updateGuestRepayment(inp.getAttribute('data-repay-amount'), inp.getAttribute('data-repay-id'), 'amount', inp.value));
      inp.addEventListener('change', () => updateGuestRepayment(inp.getAttribute('data-repay-amount'), inp.getAttribute('data-repay-id'), 'amount', inp.value));
    });
    document.querySelectorAll('[data-repay-date]').forEach(inp => {
      inp.addEventListener('change', () => updateGuestRepayment(inp.getAttribute('data-repay-date'), inp.getAttribute('data-repay-id'), 'date', inp.value));
    });
    document.querySelectorAll('[data-remove-repay]').forEach(btn => {
      btn.addEventListener('click', () => removeGuestRepayment(btn.getAttribute('data-remove-repay'), btn.getAttribute('data-repay-id')));
    });
    document.querySelectorAll('[data-tick-message]').forEach(inp => {
      inp.addEventListener('change', () => setStopTick(inp.getAttribute('data-tick-message'), 'messageSent', inp.checked));
    });
    document.querySelectorAll('[data-tick-booked]').forEach(inp => {
      inp.addEventListener('change', () => setStopTick(inp.getAttribute('data-tick-booked'), 'booked', inp.checked));
    });
    document.querySelectorAll('[data-travel-mins]').forEach(inp => {
      inp.addEventListener('change', () => setStopTravelMinutes(inp.getAttribute('data-travel-mins'), inp.value));
    });
    document.querySelectorAll('[data-travel-mode]').forEach(btn => {
      btn.addEventListener('click', () => setStopTravelMode(btn.getAttribute('data-travel-mode'), btn.getAttribute('data-mode')));
    });
    document.querySelectorAll('[data-stop-address]').forEach(inp => {
      inp.addEventListener('input', () => {
        const s = findStop(inp.getAttribute('data-stop-address'));
        if (s) { s.address = inp.value; scheduleAutoSave(); }
      });
      // On blur/confirm: keep stop address, and if linked to Places, copy into the catalogue
      // so the factory/shop remembers the corrected Apple Maps link next time.
      inp.addEventListener('change', () => {
        const s = findStop(inp.getAttribute('data-stop-address'));
        if (s) {
          s.address = inp.value;
          // Non-empty only — clearing the stop field must not wipe Places
          if (String(s.address || '').trim()) syncStopAddressToPlace(s);
        }
        scheduleAutoSave();
        render();
      });
    });
    document.querySelectorAll('[data-place-picker-add]').forEach(btn => {
      btn.addEventListener('click', () => addPlaceFromPicker(btn.getAttribute('data-place-picker-add')));
    });
    // Place select no longer auto-adds — Keith picks Time, then taps Add selected place.
    document.querySelectorAll('[data-day]').forEach(btn => {
      btn.addEventListener('click', () => { state.selectedDay = Number(btn.getAttribute('data-day')); render(); });
    });
    document.querySelectorAll('[data-stop-time]').forEach(inp => {
      // Safari / mobile: bind input+change+blur, but NEVER commit from a detached node
      // (render() destroys the input; its empty blur/input was wiping real times to cloud).
      let renderQueued = false;
      const finalize = (s) => {
        const day = state.plan.days.find(d => (d.blocks || []).some(b => b.id === s.id));
        if (day) sortDayBlocks(day);
        scheduleAutoSave();
        if (renderQueued) return;
        renderQueued = true;
        queueMicrotask(() => {
          renderQueued = false;
          render(); // captureUiState restores focus on data-stop-time
        });
      };
      const commit = (evt) => {
        if (!inp.isConnected) return; // ignore events from nodes already replaced by render()
        const id = inp.getAttribute('data-stop-time');
        if (!id) return;
        const s = findStop(id);
        if (!s) return;
        const raw = String(inp.value || '').trim();
        const type = evt && evt.type;

        if (!raw) {
          // Do not clear on intermediate empty `input` (iOS picker) or on blur.
          // Only clear when change fires with empty while still connected.
          if (type !== 'change') return;
          // Never let a synthetic empty commit overwrite a non-empty time
          // (change+empty while connected is an intentional clear).
          s.time = '';
          s.period = periodForTime(s.time);
          finalize(s);
          return;
        }

        s.time = normaliseStopTime(inp.value, '');
        s.period = periodForTime(s.time);

        // input: update in-memory only (no sort/save/render — avoids re-entrancy wipe)
        if (type === 'input') return;

        // change, or connected blur with non-empty: sort, save, render once
        finalize(s);
      };
      inp.addEventListener('input', commit);
      inp.addEventListener('change', commit);
      inp.addEventListener('blur', commit);
    });
    document.querySelectorAll('[data-stop-title]').forEach(inp => {
      inp.addEventListener('input', () => {
        const s = findStop(inp.getAttribute('data-stop-title'));
        if (s) { s.title = inp.value; scheduleAutoSave(); }
      });
    });
    document.querySelectorAll('[data-stop-notes]').forEach(inp => {
      inp.addEventListener('input', () => {
        const s = findStop(inp.getAttribute('data-stop-notes'));
        if (s) { s.notes = inp.value; scheduleAutoSave(); }
      });
    });
    document.querySelectorAll('[data-remove-stop]').forEach(btn => {
      btn.addEventListener('click', () => removeStop(btn.getAttribute('data-remove-stop')));
    });
    document.querySelectorAll('[data-move]').forEach(btn => {
      btn.addEventListener('click', () => moveStop(btn.getAttribute('data-move'), Number(btn.getAttribute('data-dir'))));
    });
    bindCatalogue(document.getElementById('app'));
  }

  function bindCatalogue(root, opts = {}) {
    const refresh = () => { if (opts.onFilter) opts.onFilter(); else render(); };
    root.querySelectorAll('[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => { state.placeFilter = btn.getAttribute('data-filter'); refresh(); });
    });
    root.querySelectorAll('[data-add-place]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-add-place');
        const place = state.catalogue.find(p => p.id === id);
        if (!place) return;
        const timeEl = root.querySelector(`[data-add-place-time="${id}"]`);
        const chosen = timeEl ? timeEl.value : '';
        addPlaceToDay(place, state.selectedDay, chosen);
      });
    });
    root.querySelectorAll('[data-place-name]').forEach(inp => {
      inp.addEventListener('input', () => {
        const id = inp.getAttribute('data-place-name');
        const p = state.catalogue.find(x => x.id === id);
        if (p) {
          p.name = inp.value;
          if (state.plan && state.plan.tourHotelPlaceId === p.id) state.plan.tourHotelName = p.name;
          scheduleAutoSave();
          updatePlaceMapsLink(id);
        }
      });
    });
    root.querySelectorAll('[data-place-address]').forEach(inp => {
      inp.addEventListener('input', () => {
        const id = inp.getAttribute('data-place-address');
        const p = state.catalogue.find(x => x.id === id);
        if (p) {
          p.address = inp.value;
          // Linked day stops with an empty address pick up the new Places address
          if (syncEmptyStopAddressesFromCatalogue(id)) scheduleAutoSave();
          else scheduleAutoSave();
          updatePlaceMapsLink(id);
        }
      });
      // Do not full-re-render on blur/confirm — maps link updates in place above.
      // On confirm, re-render so Planner stop fields show any newly filled addresses.
      inp.addEventListener('change', () => {
        const id = inp.getAttribute('data-place-address');
        if (syncEmptyStopAddressesFromCatalogue(id)) {
          scheduleAutoSave();
          render();
        } else {
          scheduleAutoSave();
        }
      });
    });
    root.querySelectorAll('[data-place-type]').forEach(sel => {
      sel.addEventListener('change', () => {
        const p = state.catalogue.find(x => x.id === sel.getAttribute('data-place-type'));
        if (!p) return;
        p.type = sel.value;
        scheduleAutoSave();
        // Only rebuild when the active category filter would hide/move this card.
        if (state.placeFilter !== 'all' && state.placeFilter !== p.type) refresh();
      });
    });
    root.querySelectorAll('[data-place-contact-method]').forEach(sel => {
      sel.addEventListener('change', () => {
        const id = sel.getAttribute('data-place-contact-method');
        const p = state.catalogue.find(x => x.id === id);
        if (p) {
          p.contactMethod = sel.value;
          scheduleAutoSave();
          updatePlaceContactPill(id);
        }
      });
    });
    root.querySelectorAll('[data-place-contact-detail]').forEach(inp => {
      inp.addEventListener('input', () => {
        const p = state.catalogue.find(x => x.id === inp.getAttribute('data-place-contact-detail'));
        if (p) { p.contactDetail = inp.value; scheduleAutoSave(); }
      });
    });
    root.querySelectorAll('[data-place-notes]').forEach(inp => {
      inp.addEventListener('input', () => {
        const p = state.catalogue.find(x => x.id === inp.getAttribute('data-place-notes'));
        if (p) { p.notes = inp.value; scheduleAutoSave(); }
      });
    });
    root.querySelectorAll('[data-remove-place]').forEach(btn => {
      btn.addEventListener('click', () => removePlace(btn.getAttribute('data-remove-place')));
    });
    root.querySelector('#btnAddPlace')?.addEventListener('click', () => {
      addCataloguePlace();
      if (opts.onFilter) opts.onFilter();
    });
  }

  function findStop(id) {
    if (id == null || id === '') return null;
    if (!state.plan || !Array.isArray(state.plan.days)) return null;
    const sid = String(id);
    for (const day of state.plan.days) {
      const s = (day.blocks || []).find(b => b && String(b.id) === sid);
      if (s) return s;
    }
    return null;
  }

  function addCataloguePlace() {
    const name = document.getElementById('newPlaceName')?.value.trim();
    if (!name) { toast('Enter a place name'); return; }
    const place = ensurePlace({
      id: uid('c'),
      name,
      type: document.getElementById('newPlaceType')?.value || 'other',
      contactMethod: document.getElementById('newPlaceContactMethod')?.value || '',
      contactDetail: document.getElementById('newPlaceContactDetail')?.value.trim() || '',
      address: document.getElementById('newPlaceAddress')?.value.trim() || '',
      notes: '',
    });
    state.catalogue.push(place);
    scheduleAutoSave();
    toast('Saved to Places');
    render();
  }

  function openSheet() {
    const sheet = document.getElementById('sheet');
    const body = document.getElementById('sheetBody');
    // Compact picker only — full Places editing lives on the Places tab
    body.innerHTML = `
      <div class="row-between" style="margin-bottom:10px;">
        <h2 style="margin:0;font-size:18px;">Add a stop</h2>
        <button type="button" class="btn btn-outline btn-sm" id="btnSheetManagePlaces">Manage Places</button>
      </div>
      ${renderPlacePickerSelect('sheetPlacePicker', 'btnSheetAddStop')}
      <p class="muted" style="margin-top:12px;">Edit contact details and addresses on the Places tab — they stay shared with this picker and Supabase.</p>
    `;
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    body.querySelectorAll('[data-place-picker-add]').forEach(btn => {
      btn.addEventListener('click', () => addPlaceFromPicker(btn.getAttribute('data-place-picker-add')));
    });
    document.getElementById('btnSheetAddStop')?.addEventListener('click', addBlankStop);
    document.getElementById('btnSheetManagePlaces')?.addEventListener('click', () => {
      closeSheet();
      setMainTab('places');
    });
  }
  function closeSheet() {
    const sheet = document.getElementById('sheet');
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    document.getElementById('sheetBody').innerHTML = '';
  }

  async function loadLiveBookings() {
    try {
      try {
        const sessionRes = await withTimeout(sb.auth.getSession(), 2500, 'Session lookup timed out');
        state.sessionEmail = sessionRes?.data?.session?.user?.email || '';
      } catch (err) {
        console.warn(err);
      }
      const { data, error } = await withTimeout(
        sb.from('bookings')
          .select('id, group_name, tour_arrival_date, departure_date, hotel_id, extra_notes, hotels(name)')
          .order('tour_arrival_date', { ascending: false })
          .limit(80),
        5000,
        'Bookings lookup timed out'
      );
      if (error) throw error;
      state.bookings = (data || []).map(b => ({
        ...b,
        hotel_name: b.hotels?.name,
        _members: [],
        _hotel_stays: [],
        _enriched: false,
      }));
      state.liveBookings = true;
    } catch (err) {
      console.warn('Planner bookings not loaded:', err);
      state.liveBookings = false;
    }
    try {
      const probe = await withTimeout(sb.from('planner_plans').select('id').limit(1), 2000, 'Planner table probe timed out');
      state.supabasePlanTable = !probe.error;
    } catch {
      state.supabasePlanTable = false;
    }
    try {
      const probePlaces = await withTimeout(sb.from('planner_places').select('id').limit(1), 2000, 'Places table probe timed out');
      state.supabasePlacesTable = !probePlaces.error;
    } catch {
      state.supabasePlacesTable = false;
    }
  }

  // On GitHub Pages: prefer same-origin booking-form.html when present; else Netlify.
  // Analytics stays on Netlify until a Pages copy exists.
  const LIVE_BOOKINGS_ORIGIN = 'https://keith-booking-form.netlify.app';
  let pagesHasBookingForm = null; // null = not probed yet

  function bookingsQueryForCurrentPlan() {
    const key = state.bookingKey;
    if (key && key !== DEMO_ID && /^[0-9]+$/.test(String(key))) {
      return '?booking=' + encodeURIComponent(String(key)) + '&layout=layout';
    }
    return '';
  }

  async function fixExternalNavLinks() {
    const onGithubPages = location.hostname.includes('github.io');
    const bookings = document.getElementById('navBookings');
    const analytics = document.getElementById('navAnalytics');
    const qs = bookingsQueryForCurrentPlan();

    let bookingsHref = 'booking-form.html' + qs;
    if (onGithubPages) {
      if (pagesHasBookingForm === null) {
        try {
          const probe = await fetch('booking-form.html', { method: 'GET', cache: 'no-store', headers: { 'Range': 'bytes=0-0' } });
          pagesHasBookingForm = probe.ok || probe.status === 206;
        } catch (_) {
          pagesHasBookingForm = false;
        }
      }
      bookingsHref = pagesHasBookingForm
        ? ('booking-form.html' + qs)
        : (LIVE_BOOKINGS_ORIGIN + '/booking-form.html' + qs);
    }
    if (bookings) bookings.href = bookingsHref;
    if (analytics) {
      analytics.href = onGithubPages
        ? (LIVE_BOOKINGS_ORIGIN + '/analytics.html')
        : 'analytics.html';
    }
  }
  fixExternalNavLinks();

  async function init() {
    // Default Auto-save ON for new users; only honour an explicit prior "false"
    const savedAutoRaw = localStorage.getItem('planner_autosave_enabled');
    const savedAutoSave = savedAutoRaw === null ? true : savedAutoRaw === 'true';
    const toggle = document.getElementById('autosaveToggle');
    if (toggle) {
      toggle.checked = savedAutoSave;
      toggleAutoSave(savedAutoSave);
    }

    const store = loadStore();
    const localCatalogue = Array.isArray(store.catalogue) && store.catalogue.length
      ? normalizeCatalogue(store.catalogue)
      : [];
    state.plans = store.plans || {};
    if (!state.plans[DEMO_ID]) state.plans[DEMO_ID] = buildDemoPlan();

    const params = new URLSearchParams(location.search);
    const requested = params.get('booking');
    const viewParam = params.get('view');
    if (viewParam === 'phone' || viewParam === 'detailed') state.viewPref = viewParam;

    // Probe tables first so cloud places/plans can load before first render
    await loadLiveBookings();

    let cloudPlaces = await fetchCloudPlaces();
    if (cloudPlaces && !cloudPlaces.length) {
      await uploadCatalogueSeed();
      cloudPlaces = await fetchCloudPlaces();
    }
    if (cloudPlaces && cloudPlaces.length) {
      // Cloud is source of truth; merge any newer local-only places carefully
      state.catalogue = mergeCatalogueLists(cloudPlaces, localCatalogue);
      // Also ensure seed names exist (in case cloud was partial)
      state.catalogue = mergeCatalogueSeed(state.catalogue);
    } else {
      state.catalogue = mergeCatalogueSeed(localCatalogue);
      // Best-effort upload so other devices get the catalogue
      if (state.supabasePlacesTable) await uploadCatalogueSeed();
    }
    state.catalogue = normalizeCatalogue(state.catalogue);

    // Prefetch cloud plan for requested booking into local cache
    const localKey = (requested && requested !== DEMO_ID)
      ? String(requested)
      : DEMO_ID;
    const prefetch = await loadPlanFromSupabase(localKey);
    if (prefetch) {
      state.plans[localKey] = preferRicherPlan(state.plans[localKey], prefetch);
    }

    if (localKey !== DEMO_ID && state.plans[localKey]) {
      await selectPlan(localKey);
    } else {
      await selectPlan(DEMO_ID);
    }

    fillGroupSelect();
    if (requested && requested !== DEMO_ID) {
      const exists = state.bookings.some(b => String(b.id) === String(requested));
      if (exists) {
        await selectPlan(String(requested));
      } else if (state.plans[requested]) {
        await selectPlan(String(requested));
        toast('Booking details offline — using the saved plan on this device');
      } else {
        toast('That booking was not found — showing the sample tour');
        await selectPlan(DEMO_ID);
      }
    } else {
      render();
    }
    if (state.supabasePlacesTable || state.supabasePlanTable) {
      setCloudStatus(true, 'Cloud ready');
    }
  }

  document.getElementById('groupSelect').addEventListener('change', e => selectPlan(e.target.value));
  document.getElementById('btnForceCloudSave').addEventListener('click', () => forceSaveToCloud());
  document.getElementById('btnExportPlan').addEventListener('click', () => exportPlanJson());
  document.getElementById('btnPhoneView').addEventListener('click', () => setViewPref('phone'));
  document.getElementById('btnDetailedView').addEventListener('click', () => setViewPref('detailed'));
  document.getElementById('btnTheme').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  document.getElementById('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
  window.addEventListener('resize', () => {
    if (state.viewPref !== 'auto') return;
    document.body.classList.toggle('view-phone', effectiveView() === 'phone');
    document.body.classList.toggle('view-detailed', effectiveView() === 'detailed');
  });

  init();
</script>
